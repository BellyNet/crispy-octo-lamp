        renderGrid()
        updateDateRange()
      }

      // Keep pills + select in sync
      function setActiveType(type) {
        activeType = type
        filterSelect.value = type
      }

      filterSelect.addEventListener('change', () => {
        setActiveType(filterSelect.value)
        applyFilter()
      })

      sortSelect.addEventListener('change', () => {
        activeSort = sortSelect.value
        // Sorting by duration only makes sense for videos — every other
        // type has duration === 0 and clusters at one end of the list.
        // Auto-flip the type filter to video and reflect it in the select.
        if (
          (activeSort === 'duration-asc' || activeSort === 'duration-desc') &&
          activeType !== 'video'
        ) {
          setActiveType('video')
          if (filterSelect) filterSelect.value = 'video'
        }
        applyFilter()
        // Remember per-model so switching back restores the user's choice.
        if (currentUsername) {
          try {
            localStorage.setItem(
              `dashboard-sort-${currentUsername}`,
              activeSort
            )
          } catch {}
        }
      })

      function updateStats() {
        if (!allMedia.length) {
          if (mediaStatsEl) mediaStatsEl.textContent = 'No media found'
          updateStatsDetails(null)
          return
        }
        let imgs = 0, gifs = 0, vids = 0, flagged = 0, captioned = 0
        let sizeImgs = 0, sizeGifs = 0, sizeVids = 0
        for (const m of allMedia) {
          const sz = m.size || 0
          if (m.type === 'image') { imgs++; sizeImgs += sz }
          else if (m.type === 'gif') { gifs++; sizeGifs += sz }
          else if (m.type === 'video') { vids++; sizeVids += sz }
          if (m.flagged) flagged++
          if (m.hasCaption) captioned++
        }
        const totalSize = sizeImgs + sizeGifs + sizeVids
        const parts = []
        if (totalSize) parts.push(formatFileSize(totalSize))
        if (imgs) parts.push(`${imgs} image${imgs !== 1 ? 's' : ''}`)
        if (gifs) parts.push(`${gifs} GIF${gifs !== 1 ? 's' : ''}`)
        if (vids) parts.push(`${vids} video${vids !== 1 ? 's' : ''}`)
        if (flagged) parts.push(`${flagged} flagged`)
        if (mediaStatsEl) mediaStatsEl.textContent = parts.join(' · ')

        updateStatsDetails({ imgs, gifs, vids, flagged, captioned, sizeImgs, sizeGifs, sizeVids, totalSize })

        // Update filter dropdown labels with counts.
        const labels = {
          all: `All (${allMedia.length})`,
          image: imgs ? `Images (${imgs})` : 'Images',
          gif: gifs ? `GIFs (${gifs})` : 'GIFs',
          video: vids ? `Videos (${vids})` : 'Videos',
          flagged: flagged ? `Flagged (${flagged})` : 'Flagged',
        }
        for (const [type, label] of Object.entries(labels)) {
          const opt = filterSelect.querySelector(`option[value="${type}"]`)
          if (opt) opt.textContent = label
        }
        // Hide the Flagged option when nothing is flagged — keeps the menu clean.
        const flaggedOpt = filterSelect.querySelector('option[value="flagged"]')
        if (flaggedOpt) flaggedOpt.hidden = flagged === 0
      }

      // Populates the slide-down details panel under the header. Built lazily —
      // panel is hidden by default and only rendered when the user expands it.
      function updateStatsDetails(s) {
        const panel = document.getElementById('stats-details')
        if (!panel) return
        if (!s) { panel.innerHTML = ''; return }
        const row = (label, value) => `<div class="stats-row"><span class="stats-label">${label}</span><span class="stats-value">${value}</span></div>`
        const pct = (n, d) => d ? Math.round((n / d) * 100) + '%' : '—'
        const total = allMedia.length
        panel.innerHTML = `
          <div class="stats-grid">
            ${row('Total size', formatFileSize(s.totalSize) || '—')}
            ${row('Files',       total.toLocaleString())}
            ${row('Images',     `${s.imgs.toLocaleString()} · ${formatFileSize(s.sizeImgs) || '0'}`)}
            ${row('GIFs',       `${s.gifs.toLocaleString()} · ${formatFileSize(s.sizeGifs) || '0'}`)}
            ${row('Videos',     `${s.vids.toLocaleString()} · ${formatFileSize(s.sizeVids) || '0'}`)}
            ${row('Captioned',  `${s.captioned.toLocaleString()} (${pct(s.captioned, total)})`)}
            ${row('Flagged',    `${s.flagged.toLocaleString()}${s.flagged ? ` (${pct(s.flagged, total)})` : ''}`)}
          </div>
        `
      }

      function updateDateRange() {
        if (!filtered.length) {
          dateRangeEl.textContent = ''
          return
        }

        // Pick the value to range over by sort kind. Compute min/max explicitly
        // (don't rely on filtered order — it might be sorted by size/duration).
        const pickValue =
          activeSort === 'added-asc' || activeSort === 'added-desc'
            ? (m) => m.addedMs
            : (m) => m.mediaDateMs || m.addedMs

        let min = Infinity,
          max = 0
        for (const m of filtered) {
          const v = pickValue(m)
          if (!v) continue
          if (v < min) min = v
          if (v > max) max = v
        }
        if (min === Infinity) {
          dateRangeEl.textContent = ''
          return
        }
        const toISO = (ms) => new Date(ms).toISOString()
        dateRangeEl.textContent = `${formatDateShort(toISO(min))} – ${formatDateShort(toISO(max))}`
      }

      // ─── GRID RENDER ──────────────────────────────────────────────────────
      const SOURCE_LABELS = {
        exif: 'exif',
        mp4: 'mp4',
        uploaded: 'upload',
        filesystem: 'local*',
      }
      const SOURCE_TIPS = {
        exif: 'Date from embedded EXIF metadata',
        mp4: 'Date from video container metadata (ffprobe)',
        uploaded: 'Platform upload date (set by milkmaid)',
        filesystem: '* Local download date — least reliable',
        filename: 'filename timestamp',
      }
      const DATE_FMT = { year: '2-digit', month: 'numeric', day: 'numeric' }

      function createCard(item, i) {
        const card = document.createElement('div')
        card.className = 'media-card' + (item.flagged ? ' flagged' : '')
        card.dataset.index = i
        // Native tooltip with the post title — works at any card size, the
        // only inline render path on S/M where there isn't room for text.
        const cleanedCardTitle = cleanPostTitle(item)
        if (cleanedCardTitle) card.title = cleanedCardTitle
        if (item.flagged) {
          const ribbon = document.createElement('div')
          ribbon.className = 'card-flag-ribbon'
          ribbon.title = 'Flagged for deletion'
          ribbon.textContent = '🚩'
          card.appendChild(ribbon)
        }

        const thumb = document.createElement('div')
        thumb.className = 'card-thumb'

        if (item.type === 'video') {
          // Animated GIF preview: pre-generated by the nightly /thumbnail/
          // pass and cached on disk, so this is just an <img> load — no
          // browser-side encoding. Modern browsers handle dozens to
          // hundreds of these without breaking a sweat (Giphy / Tenor).
          const img = document.createElement('img')
          img.loading = 'lazy'
          img.style.cssText =
            'width:100%;height:100%;object-fit:cover;display:block;'
          img.src = item.previewUrl || item.thumbUrl || ''
          img.alt = item.filename
          img.onerror = () => {
            // Fall back to the static ffmpeg-frame JPEG (/thumb/ route)
            // if the GIF preview is missing.
            if (img.dataset.fallback) {
              img.style.opacity = '0.3'
              img.alt = '⚠ preview unavailable'
              return
            }
            img.dataset.fallback = '1'
            img.src = item.thumbUrl || ''
          }
          thumb.appendChild(img)

          const tier = resolutionTier(item.width, item.height)
          if (tier) {
            const chip = document.createElement('span')
            chip.className = `card-res-badge tier-${tier.key}`
            chip.textContent = tier.label
            chip.title = `${item.width}×${item.height}`
            thumb.appendChild(chip)
          }
        } else {
          const img = document.createElement('img')
          img.loading = 'lazy'
          // Use the small JPEG thumbnail for grid cards. The lightbox still
          // loads item.url (the original) when the card is clicked.
          img.src = item.thumbUrl || item.url
          img.alt = item.filename
          img.onerror = () => {
            // Fall back to the source if the thumb endpoint failed (e.g. sharp
            // rejected the format) — slower but the card still shows something.
            if (img.dataset.fallback) {
              img.style.opacity = '0.3'
              img.alt = '⚠ load error'
              return
            }
            img.dataset.fallback = '1'
            img.src = item.url
          }
          thumb.appendChild(img)
        }

        const overlay = document.createElement('div')
        overlay.className = 'card-overlay'
        thumb.appendChild(overlay)

        // Post title strip pinned to the bottom of the thumb. Visible only
        // when the grid is in Large mode (CSS-gated by body.card-size-large).
        if (cleanedCardTitle) {
          const titleEl = document.createElement('div')
          titleEl.className = 'card-post-title'
          titleEl.textContent = cleanedCardTitle
          thumb.appendChild(titleEl)
        }

        const footer = document.createElement('div')
        footer.className = 'card-footer'

        const left = document.createElement('div')
        left.style.cssText =
          'display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden;'

        const badge = document.createElement('span')
        badge.className = `type-badge ${item.type}`
        badge.textContent = item.type === 'image' ? 'img' : item.type
        left.appendChild(badge)

        if (item.source && item.source !== 'filename') {
          const srcBadge = document.createElement('span')
          srcBadge.className = `source-badge ${item.source}`
          srcBadge.textContent = SOURCE_LABELS[item.source] || item.source
          srcBadge.title = SOURCE_TIPS[item.source] || item.source
          left.appendChild(srcBadge)
        }

        const dateEl = document.createElement('span')
        dateEl.className = 'card-date'
        dateEl.textContent = item.date
          ? new Date(item.date).toLocaleDateString('en-US', DATE_FMT)
          : '—'
        dateEl.title =
          formatDate(item.date) + (item.source ? ` [${item.source}]` : '')
        left.appendChild(dateEl)

        const addedEl = document.createElement('span')
        addedEl.className = 'card-added'
        addedEl.textContent = item.addedMs
          ? new Date(item.addedMs).toLocaleDateString('en-US', DATE_FMT)
          : '—'
        addedEl.title = item.addedMs
          ? `Added: ${formatDate(new Date(item.addedMs).toISOString())}`
          : 'Added date unknown'

        footer.appendChild(left)
        footer.appendChild(addedEl)
        card.appendChild(thumb)
        card.appendChild(footer)
        card.addEventListener('click', () => openLightbox(i))
        return card
      }

      // Renders the first ~200 cards synchronously for fast first paint, then
      // appends 200 more whenever the user scrolls within 500px of the bottom.
      // For a 4000-item model, mobile only creates ~200 DOM nodes upfront
      // instead of all 4000 — first paint goes from seconds to milliseconds.
      let _renderToken = 0
      let _scrollObserver = null
      function renderGrid() {
        gridEl.innerHTML = ''
        if (_scrollObserver) {
          _scrollObserver.disconnect()
          _scrollObserver = null
        }

        if (!filtered.length) {
          noResultsEl.style.display = 'block'
          return
        }
        noResultsEl.style.display = 'none'

        const token = ++_renderToken
        // Smaller first batch on phones: iPhones repaint 60 cards quickly,
        // get the user something they can scroll, then the IntersectionObserver
        // streams the rest in. Desktop keeps 200 since the first batch fits
        // multiple viewports without scrolling.
        const onPhone = window.matchMedia('(max-width: 640px)').matches
        const INITIAL = onPhone ? 60 : 200
        const BATCH = onPhone ? 60 : 200
        let i = 0

        const renderBatch = (n) => {
          if (_renderToken !== token) return
          const end = Math.min(i + n, filtered.length)
          const frag = document.createDocumentFragment()
          for (; i < end; i++) frag.appendChild(createCard(filtered[i], i))
          gridEl.appendChild(frag)
        }

        renderBatch(INITIAL)
        if (i >= filtered.length) return

        // Sentinel sits at the end of the grid; when it enters the viewport
        // (or gets within 500px) we render the next batch and re-observe.
        const sentinel = document.createElement('div')
        sentinel.id = 'grid-sentinel'
        sentinel.style.cssText = 'grid-column: 1 / -1; height: 1px;'
        gridEl.appendChild(sentinel)

        _scrollObserver = new IntersectionObserver(
          (entries) => {
            if (!entries[0].isIntersecting) return
            if (_renderToken !== token) {
              _scrollObserver.disconnect()
              return
            }
            // Re-attach sentinel after the new cards so it stays at the bottom.
            gridEl.removeChild(sentinel)
            renderBatch(BATCH)
            if (i >= filtered.length) {
              _scrollObserver.disconnect()
              _scrollObserver = null
            } else {
              gridEl.appendChild(sentinel)
            }
          },
          {
            root: document.getElementById('grid-container'),
            rootMargin: '500px',
          }
        )
        _scrollObserver.observe(sentinel)
      }

      // ─── LIGHTBOX (PhotoSwipe v5) ─────────────────────────────────────────
      // Use PhotoSwipe core directly (no lightbox wrapper) for programmatic use.
      // Cache the import promise so the first click opens instantly.
      let _pswpModule = null
      // Session-level unmute preference. First video must always start
      // muted to satisfy Chrome's autoplay policy; once the user clicks
      // the dedicated unmute button on any video, every subsequent
      // video in the same page session unmutes itself once playback
      // begins (handled by a one-shot 'playing' listener per video).
      let videoUnmutedPref = false
      function loadPswp() {
        if (!_pswpModule) {
          _pswpModule = import(
            '/vendor/photoswipe-5.4.4/photoswipe.esm.js'
          ).then((m) => m.default)
        }
        return _pswpModule
      }
      loadPswp() // preload immediately

      function openLightbox(startIndex) {
        loadPswp().then((PhotoSwipe) => {
          // Snapshot the HD flag once per open — mid-lightbox toggles
          // don't rebuild the already-mounted slides, they take effect
          // on the next open. This matches how card-size / filter
          // changes propagate too.
          const useMobileVariant = IS_MOBILE && !hdMode
          const dataSource = filtered.map((item) => {
            // Render as <video> when it's a real video, OR when it's a
            // gif on mobile in SD mode (server hands us a 720p H.264 MP4
            // that's 5–10× smaller than the source GIF and plays fine in
            // <video>). HD mode on mobile falls through to the same path
            // desktop uses — gif as animated <img>, no promotion.
            const asVideo =
              item.type === 'video' ||
              (useMobileVariant && item.type === 'gif' && item.mobileUrl)
            if (asVideo) {
              // Every video: muted + autoplay + loop + playsinline +
              // controls visible.
              //
              // Why muted: Chrome's autoplay policy refuses unmuted
              // play() without a fresh, unconsumed user gesture, and the
              // card-click gesture doesn't reliably survive PhotoSwipe's
              // async init chain — the result was clips frozen on the
              // first frame until the user manually hit play. Every
              // major social site (Reels, TikTok, Twitter video) ships
              // this exact pattern: muted autoplay, with the unmute
              // button one click away in the standard controls.
              //
              // preload="metadata" loads the duration + first frame
              // fast; syncVideos promotes the active slide to "auto" and
              // calls play(), and the cached animated GIF preview is the
              // poster so the slide is never black.
              const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])
              )
              // Prefer the mobile MP4 when SD mode is active on mobile
              // AND the server offered one. HD mode, desktop, and any
              // missing mobileUrl fall through to the original.
              const src = esc(
                useMobileVariant && item.mobileUrl ? item.mobileUrl : item.url
              )
              // No `poster`, no `controls` initially. Tap on the video
              // toggles the native controls (wired up in contentAppend
              // below). The autoplay+muted+playsinline trio is what
              // every social-app video player does; let it do its job
              // without us calling load() or pause() in the middle.
              const html =
                `<div class="pswp-video-wrap">` +
                  `<video src="${src}" loop muted autoplay playsinline preload="auto"></video>` +
                `</div>`
              return { html, _item: item }
            }
            return {
              src: item.url,
              width: item.width || 0,
              height: item.height || 0,
              _item: item,
            }
          })

          const pswp = new PhotoSwipe({
            dataSource,
            index: startIndex,
            bgOpacity: 0.97,
            // Full-bleed: chrome floats over the media. Close button and
            // chrome-toggle sit absolutely at top-right, info panel sits
            // absolutely at the bottom and only paints when chrome is
            // shown — so there's no need to reserve padding for them.
            padding: { top: 0, bottom: 0, left: 0, right: 0 },
            loop: true,
            wheelToZoom: true,
            // PhotoSwipe caps its built-in `fit` zoom at 1.0, so small
            // images sat at their actual pixel size in the middle of a
            // huge viewport. Drop the cap: scale so that the smaller
            // axis fills the viewport, matching the video's
            // `object-fit: contain` behavior. The max-zoom raises
            // proportionally so pinch-zoom still has room.
            initialZoomLevel: (z) => {
              const pa = z.panAreaSize, es = z.elementSize
              if (!pa || !es || !es.x || !es.y) return 1
              return Math.min(pa.x / es.x, pa.y / es.y)
            },
            secondaryZoomLevel: (z) => {
              const pa = z.panAreaSize, es = z.elementSize
              if (!pa || !es || !es.x || !es.y) return 2
              return Math.min(pa.x / es.x, pa.y / es.y) * 2
            },
            maxZoomLevel: (z) => {
              const pa = z.panAreaSize, es = z.elementSize
              if (!pa || !es || !es.x || !es.y) return 4
              return Math.min(pa.x / es.x, pa.y / es.y) * 4
            },
          })

          let infoPanelEl = null

          // Caption fetch cache for this lightbox instance — keyed by item URL.
          // Avoids re-fetching when the user swipes back and forth.
          const _captionCache = new Map()
          async function loadCaption(item) {
            if (!item || !item.hasCaption) return null
            if (_captionCache.has(item.url)) return _captionCache.get(item.url)
            try {
              const r = await fetch(
                `/api/caption/${encodeURIComponent(currentUsername || '')}/${item.folder}/${encodeURIComponent(item.filename)}`
              )
              if (!r.ok) {
                _captionCache.set(item.url, null)
                return null
              }
              const data = await r.json()
              const txt =
                data && typeof data.text === 'string' ? data.text : null
              _captionCache.set(item.url, txt)
              return txt
            } catch {
              _captionCache.set(item.url, null)
              return null
            }
          }

          pswp.on('uiRegister', () => {
            // Note: PhotoSwipe v5's default UI already includes a top-left
            // slide counter, so we don't register our own here.

            // Full-width scrubbable timeline pinned just below the top bar.
            // Mapping is linear-by-index — every filtered item is reachable
            // with a proportional drag, regardless of how dates cluster.
            if (filtered.length > 1) {
              pswp.ui.registerElement({
                name: 'pswp-date-slider',
                // Inline in the top bar between counter (left, order ~5)
                // and the buttons on the right (close at 20). order 10
                // lands it between them with flex:1 so it stretches.
                appendTo: 'bar',
                order: 10,
                onInit(el) {
                  const last = filtered.length - 1
                  // Items may have a null .date (rare — older entries before
                  // the date pipeline landed); fall back to addedMs so the
                  // range and active labels always render.
                  const itemDateISO = (it) =>
                    it.date ||
                    (it.addedMs ? new Date(it.addedMs).toISOString() : null)

                  // Track first, label after — the label uses a sibling
                  // selector (.track ~ .label) to fade in only while the
                  // user is hovering or scrubbing the track. Range
                  // labels are dropped (no room inside the 44px bar).
                  const track = document.createElement('div')
                  track.className = 'pswp-date-slider-track'
                  const fill = document.createElement('div')
                  fill.className = 'pswp-date-slider-fill'
                  const thumb = document.createElement('div')
                  thumb.className = 'pswp-date-slider-thumb'
                  track.append(fill, thumb)
                  const label = document.createElement('div')
                  label.className = 'pswp-date-slider-label'
                  el.append(track, label)

                  // Position thumb + fill + label from the current slide's
                  // index. Driven by PhotoSwipe `change` events and by the
                  // user dragging the track.
                  const updateFromIndex = () => {
                    const pct = pswp.currIndex / last
                    thumb.style.left = `${pct * 100}%`
                    fill.style.width = `${pct * 100}%`
                    const date = formatDateShort(
                      itemDateISO(filtered[pswp.currIndex])
                    )
                    label.textContent = date
                    thumb.title = date
                    track.title = date
                  }
                  pswp.on('change', updateFromIndex)
                  updateFromIndex()

                  // Scrubbing: pointer X → linear filtered index → goTo().
                  // rAF coalesces rapid moves into one navigation per frame.
                  let pendingIdx = -1
                  let rafQueued = false
                  const flush = () => {
                    rafQueued = false
                    if (pendingIdx >= 0 && pendingIdx !== pswp.currIndex)
                      pswp.goTo(pendingIdx)
                    pendingIdx = -1
                  }
                  const scrubTo = (clientX) => {
                    const rect = track.getBoundingClientRect()
                    if (!rect.width) return
                    const pct = Math.max(
                      0,
                      Math.min(1, (clientX - rect.left) / rect.width)
                    )
                    pendingIdx = Math.round(pct * last)
                    if (!rafQueued) {
                      rafQueued = true
                      requestAnimationFrame(flush)
                    }
                  }

                  // Pointer capture keeps move/up events flowing to the
                  // track even after the cursor leaves it — no document-
                  // level listener management or `dragging` bookkeeping.
                  let captured = false
                  track.addEventListener('pointerdown', (e) => {
                    // Eat the gesture so PhotoSwipe doesn't try to drag the
                    // slide while we scrub.
                    e.preventDefault()
                    e.stopPropagation()
                    captured = true
                    track.classList.add('pswp-date-slider-active')
                    try { track.setPointerCapture(e.pointerId) } catch {}
                    scrubTo(e.clientX)
                  })
                  track.addEventListener('pointermove', (e) => {
                    if (captured) scrubTo(e.clientX)
                  })
                  const release = (e) => {
                    if (!captured) return
                    captured = false
                    track.classList.remove('pswp-date-slider-active')
                    try { track.releasePointerCapture(e.pointerId) } catch {}
                  }
                  track.addEventListener('pointerup', release)
                  track.addEventListener('pointercancel', release)
                  // Block bubble so the lightbox doesn't react to clicks on
                  // the timeline (close on background click, etc.).
                  el.addEventListener('click', (e) => e.stopPropagation())
                },
              })
            }

            // Info panel — pinned to the bottom of the lightbox whenever
            // chrome is shown. Layout, top to bottom:
            //   1. Post title (headline — large, linked to the post URL)
            //   2. LoRA caption block (always when present, even on desktop)
            //   3. Compact meta row (badges, date+source, dimensions,
            //      duration, size, filename, added date, FLAGGED chip)
            pswp.ui.registerElement({
              name: 'pswp-info-panel',
              appendTo: 'root',
              onInit(el) {
                infoPanelEl = el
                const update = () => {
                  const item = filtered[pswp.currIndex]
                  if (!item) return
                  el.replaceChildren()

                  // 1. Headline — post title only. Plain text (no link);
                  //    the source URL has its own dedicated link button
                  //    in the top bar. Only rendered when we have real
                  //    text after stripping the "<modelname> /" prefix.
                  const cleanTitle = cleanPostTitle(item)
                  if (cleanTitle) {
                    const headline = document.createElement('div')
                    headline.className = 'pswp-info-post-headline'
                    headline.textContent = cleanTitle
                    el.appendChild(headline)
                  }

                  // 2. LoRA caption block. Strip the leading "<model>,"
                  //    trigger word so the visible caption reads as
                  //    natural text. Render synchronously with the
                  //    panel, fill in once the fetch resolves.
                  if (item.hasCaption) {
                    const capBlock = document.createElement('div')
                    capBlock.className = 'pswp-info-caption-block'
                    capBlock.textContent = 'Loading caption…'
                    el.appendChild(capBlock)
                    const idxAtStart = pswp.currIndex
                    loadCaption(item).then((text) => {
                      if (pswp.currIndex !== idxAtStart) return
                      const cleaned = stripUsernamePrefix(text)
                      if (cleaned) capBlock.textContent = cleaned
                      else capBlock.remove()
                    })
                  }

                  // 3. Post comments — the top few, pulled straight from
                  //    the sidecar. Author is chipped in accent color;
                  //    text runs inline after it. Block scrolls when
                  //    long. Header shows "N of TOTAL comments" when
                  //    the scraper truncated the list.
                  const comments = Array.isArray(item.post?.comments)
                    ? item.post.comments
                    : []
                  if (comments.length) {
                    const total =
                      typeof item.post.commentCount === 'number' &&
                      item.post.commentCount > comments.length
                        ? item.post.commentCount
                        : null
                    const header = document.createElement('div')
                    header.className = 'pswp-info-comment-count'
                    header.textContent = total
                      ? `Top ${comments.length} of ${total} comments`
                      : `${comments.length} comment${comments.length === 1 ? '' : 's'}`
                    el.appendChild(header)

                    const cbox = document.createElement('div')
                    cbox.className = 'pswp-info-comments'
                    for (const c of comments) {
                      const row = document.createElement('div')
                      row.className = 'pswp-info-comment'
                      if (c.author) {
                        const a = document.createElement('span')
                        a.className = 'pswp-info-comment-author'
                        a.textContent = c.author
                        row.appendChild(a)
                      }
                      const t = document.createElement('span')
                      t.textContent = c.text || ''
                      row.appendChild(t)
                      cbox.appendChild(row)
                    }
                    el.appendChild(cbox)
                  }

                  // 4. Meta row — media date, added date, file size, and
                  //    the FLAGGED chip when set. Sparse by design; the
                  //    card already shows type / dims / duration / source.
                  const row = document.createElement('div')
                  row.className = 'pswp-info-row'

                  if (item.flagged) {
                    const fb = document.createElement('span')
                    fb.className = 'pswp-info-flagged'
                    fb.textContent = 'FLAGGED'
                    row.appendChild(fb)
                  }

                  if (item.date) {
                    const dateSpan = document.createElement('span')
                    dateSpan.className = 'pswp-info-date'
                    dateSpan.textContent = `Posted ${formatDate(item.date)}`
                    row.appendChild(dateSpan)
                  }

                  if (item.addedMs) {
                    const addedSpan = document.createElement('span')
                    addedSpan.className = 'pswp-info-added'
                    addedSpan.textContent = `Added ${formatDate(new Date(item.addedMs).toISOString())}`
                    row.appendChild(addedSpan)
                  }

                  // File size — reflects the version actually being
                  // viewed, not just the source. In SD (compressed mp4
                  // via /media-mobile/) we HEAD-fetch the mp4 to get the
                  // real on-wire size; in HD we show item.size (source).
                  // Tagged with " · SD" / " · HD" when a mobile variant
                  // exists so it's clear which byte count you're seeing.
                  if (item.size || item.mobileUrl) {
                    const sizeSpan = document.createElement('span')
                    sizeSpan.className = 'pswp-info-size'
                    sizeSpan.textContent = formatBytes(item.size) || '…'
                    row.appendChild(sizeSpan)

                    const refreshSize = async () => {
                      // Bail if the slide changed under us — no point
                      // updating a size span that's about to be replaced
                      if (filtered[pswp.currIndex] !== item) return
                      const mode = detectCurrentMode()
                      if (mode === 'SD' && item.mobileUrl) {
                        const sz = await fetchMobileSize(item.mobileUrl)
                        if (filtered[pswp.currIndex] !== item) return
                        sizeSpan.textContent = sz
                          ? `${formatBytes(sz)} · SD`
                          : `${formatBytes(item.size)}${item.mobileUrl ? ' · SD' : ''}`
                      } else {
                        sizeSpan.textContent = `${formatBytes(item.size)}${item.mobileUrl ? ' · HD' : ''}`
                      }
                    }
                    refreshSize()
                    // Re-render when the mode flips — swapCurrentTo mutates
                    // the DOM first, then setHdMode fires listeners here,
                    // so detectCurrentMode() sees the new state.
                    const off = onHdChange(() =>
                      // Give the DOM swap a tick to settle before we
                      // re-inspect it via detectCurrentMode.
                      queueMicrotask(refreshSize)
                    )
                    sizeSpan.dataset.hdListenerBound = '1'
                    // Best-effort teardown when PhotoSwipe drops the
                    // slide's holder element; the listener would otherwise
                    // linger for the life of the lightbox.
                    pswp.on('destroy', off)
                  }

                  el.appendChild(row)
                }
                pswp.on('change', update)
                update()
              },
            })

            // (The previous caption sidebar and its toggle button are gone:
            // the bottom info panel now carries both the post title and
            // the LoRA caption, gated by the single chrome-toggle below.)

            // Open-source-post link button. Shows up only when the item
            // has a mediaPageUrl / mediaUrl on its sidecar `source`. We
            // mount the button always (so PhotoSwipe doesn't reflow on
            // every slide change) and toggle visibility per slide.
            //
            // Use visibility:hidden (not display:none) so toggling it
            // doesn't reflow the top bar's flex layout. Refresh on
            // every lifecycle event that could change the current slide
            // — `change` doesn't fire on initial open, so onInit alone
            // would leave the button stuck.
            let linkBtnEl = null
            const refreshLinkBtn = () => {
              if (!linkBtnEl) return
              const item = filtered[pswp.currIndex] || filtered[0]
              const url = item && item.post && item.post.url
              if (url) {
                linkBtnEl.style.visibility = 'visible'
                linkBtnEl.style.pointerEvents = 'auto'
                linkBtnEl.dataset.url = url
                linkBtnEl.title = `Open source: ${url}`
              } else {
                linkBtnEl.style.visibility = 'hidden'
                linkBtnEl.style.pointerEvents = 'none'
                delete linkBtnEl.dataset.url
              }
            }
            // HD/SD chip in the PhotoSwipe top bar (mobile only).
            //
            // Truth model: the chip does NOT parrot the hdMode preference
            // — it inspects the currently-mounted media element and
            // labels what the user is *actually* looking at. This
            // matters because the two can disagree:
            //   * SD preference + mobile mp4 404 → fallback swapped the
            //     <video> for an <img src=item.url>, so the user is on
            //     the original (HD) even though the toggle says SD.
            //   * HD preference on a gif → we render <img> directly with
            //     item.url, so HD is honest.
            //   * Any image → always HD (no compressed variant exists).
            //
            // Tap toggles the preference AND swaps the current slide in
            // place: video src flips, or gif-video↔img swap. Global
            // preference persists via setHdMode for next lightbox open.
            let hdChipEl = null
            const detectCurrentMode = () => {
              const slide = pswp.currSlide
              const holder = slide?.holderElement
              if (!holder) return null
              const video = holder.querySelector('.pswp-video-wrap video')
              if (video) {
                const src = video.currentSrc || video.src || ''
                return src.includes('/media-mobile/') ? 'SD' : 'HD'
              }
              const img = holder.querySelector(
                '.pswp-video-wrap img, .pswp__img'
              )
              if (img) return 'HD'
              return null
            }
            const syncHdChip = () => {
              if (!hdChipEl) return
              const detected = detectCurrentMode()
              const label = detected || (hdMode ? 'HD' : 'SD')
              hdChipEl.textContent = label
              hdChipEl.classList.toggle('pswp-hd-on', label === 'HD')
              hdChipEl.title =
                label === 'HD'
                  ? 'Viewing original (full quality). Tap for compressed.'
                  : 'Viewing compressed 720p mp4. Tap for full HD.'
            }
            // Expose to the video-fallback path so it can refresh the
            // chip the moment it swaps a <video> for an <img>.
            window.__refreshHdChip = syncHdChip

            const swapCurrentTo = (targetMode) => {
              const slide = pswp.currSlide
              if (!slide) return
              const item = filtered[slide.index]
              if (!item || !item.mobileUrl) return
              const holder = slide.holderElement
              if (!holder) return
              const wrap = holder.querySelector('.pswp-video-wrap')
              if (item.type === 'gif') {
                if (targetMode === 'SD' && wrap) {
                  // gif in HD (img inside wrap) → SD (video with mp4)
                  const oldImg = wrap.querySelector('img')
                  if (!oldImg) return
                  const v = document.createElement('video')
                  v.src = item.mobileUrl
                  v.loop = true
                  v.muted = true
                  v.autoplay = true
                  v.playsInline = true
                  v.preload = 'auto'
                  oldImg.replaceWith(v)
                  v.play().catch(() => {})
                } else if (targetMode === 'HD' && wrap) {
                  // gif in SD (video with mp4) → HD (img with source gif)
                  const oldVid = wrap.querySelector('video')
                  if (!oldVid) return
                  const img = document.createElement('img')
                  img.src = item.url
                  img.style.maxWidth = '100%'
                  img.style.maxHeight = '100%'
                  img.style.objectFit = 'contain'
                  oldVid.replaceWith(img)
                }
              } else if (item.type === 'video' && wrap) {
                const video = wrap.querySelector('video')
                if (!video) return
                const currentSrc = video.currentSrc || video.src || ''
                const currentlySD = currentSrc.includes('/media-mobile/')
                if (
                  (targetMode === 'SD' && currentlySD) ||
                  (targetMode === 'HD' && !currentlySD)
                )
                  return
                video.src = targetMode === 'SD' ? item.mobileUrl : item.url
                video.load()
                video.play().catch(() => {})
              }
            }

            if (IS_MOBILE) {
              pswp.ui.registerElement({
                name: 'pswp-hd-chip',
                order: 9,
                isButton: true,
                title: 'HD/SD',
                html: '<span class="pswp-hd-label">SD</span>',
                onInit(el) {
                  hdChipEl =
                    el.querySelector('.pswp-hd-label') || el
                  syncHdChip()
                  const off = onHdChange(syncHdChip)
                  pswp.on('change', syncHdChip)
                  pswp.on('contentActivate', syncHdChip)
                  pswp.on('contentAppend', () => {
                    syncHdChip()
                    setTimeout(syncHdChip, 60)
                  })
                  pswp.on('destroy', () => {
                    off()
                    if (window.__refreshHdChip === syncHdChip) {
                      delete window.__refreshHdChip
                    }
                  })
                },
                onClick() {
                  const nextMode = detectCurrentMode() === 'HD' ? 'SD' : 'HD'
                  // Order matters: mutate the DOM first, THEN broadcast
                  // via setHdMode. Listeners (the size span refresh, the
                  // header button, syncHdChip) call detectCurrentMode()
                  // and would see the stale pre-swap state if we flipped
                  // the flag first.
                  swapCurrentTo(nextMode)
                  setHdMode(nextMode === 'HD')
                  setTimeout(syncHdChip, 30)
                },
              })
            }

            pswp.ui.registerElement({
              name:     'pswp-link-button',
              order:    8,
              isButton: true,
              title:    'Open source post',
              html:     '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4h4v4"/><path d="M16 4l-7 7"/><path d="M14 11v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>',
              onInit(el) {
                linkBtnEl = el
                refreshLinkBtn()
                pswp.on('change', refreshLinkBtn)
                pswp.on('afterInit', refreshLinkBtn)
                pswp.on('contentActivate', refreshLinkBtn)
              },
              onClick() {
                const url = linkBtnEl?.dataset?.url
                if (url) window.open(url, '_blank', 'noopener,noreferrer')
              },
            })

            // Flag-for-deletion toggle. POSTs to /api/users/:user/flag, updates
            // the in-memory item, refreshes the card's red ribbon in the grid.
            let flagBtnEl = null
            const refreshFlagBtn = () => {
              const item = filtered[pswp.currIndex]
              if (!item || !flagBtnEl) return
              flagBtnEl.classList.toggle('pswp-flag-active', !!item.flagged)
              flagBtnEl.title = item.flagged ? 'Unflag (was marked for deletion)' : 'Flag for deletion'
            }
            pswp.ui.registerElement({
              name:     'pswp-flag-button',
              order:    7,
              isButton: true,
              title:    'Flag for deletion',
              html:     '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="2" x2="5" y2="18"/><path d="M5 3.5h10l-2 3 2 3H5"/></svg>',
              onInit(el) {
                flagBtnEl = el
                refreshFlagBtn()
                pswp.on('change', refreshFlagBtn)
              },
              async onClick(e, el) {
                const item = filtered[pswp.currIndex]
                if (!item || !currentUsername) return
                const next = !item.flagged
                el.disabled = true
                try {
                  const r = await fetch(
                    `/api/users/${encodeURIComponent(currentUsername)}/flag`,
                    {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ folder: item.folder, filename: item.filename, flagged: next }),
                    }
                  )
                  if (!r.ok) throw new Error('flag failed')
                  item.flagged = next
                  // Patch the underlying allMedia entry too (filtered may be a copy).
                  const src = allMedia.find((m) => m.folder === item.folder && m.filename === item.filename)
                  if (src) src.flagged = next
                  // Refresh the affected card in the grid without re-rendering everything.
                  const card = gridEl.querySelector(`.media-card[data-index="${pswp.currIndex}"]`)
                  if (card) {
                    card.classList.toggle('flagged', next)
                    let ribbon = card.querySelector('.card-flag-ribbon')
                    if (next && !ribbon) {
                      ribbon = document.createElement('div')
                      ribbon.className = 'card-flag-ribbon'
                      ribbon.title = 'Flagged for deletion'
                      ribbon.textContent = '🚩'
                      card.appendChild(ribbon)
                    } else if (!next && ribbon) {
                      ribbon.remove()
                    }
                  }
                  refreshFlagBtn()
                  updateStats()
                } catch {
                  // Soft fail — the next reload from the server will reconcile.
                } finally {
                  el.disabled = false
                }
              },
            })

            // Single chrome toggle (chevron) — collapses every non-essential
            // bit of UI behind one tap so the fullscreen view is just media
            // + native mute + this + close. Tapping it reveals the date
            // slider, info panel (post title + caption + meta), counter,
            // and arrows all at once. Lives at order 19, just left of
            // close (20). Icon flips up/down via CSS based on whether the
            // root carries .pswp--chrome-hidden.
            pswp.ui.registerElement({
              name: 'pswp-chrome-toggle',
              order: 19,
              isButton: true,
              title: 'Show controls',
              html: '<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 10 13 15 8"/></svg>',
              onClick(e, el) {
                const root = pswp.element
                if (!root) return
                const hidden = root.classList.toggle('pswp--chrome-hidden')
                el.title = hidden ? 'Show controls' : 'Hide controls'
                // Also dismiss any active video controls so the info
                // panel + date slider come back. Tapping the video
                // itself can't safely toggle them off (clicks on the
                // native mute/play buttons retarget to <video> and
                // would hide controls mid-interaction), so this button
                // is the one place to clear them.
                if (hidden) {
                  root.querySelectorAll('.pswp-video-wrap video').forEach((v) => {
                    v.removeAttribute('controls')
                  })
                  root.classList.remove('pswp--video-controls')
                }
              },
            })
          })

          pswp.on('afterInit', () => {
            if (pswp.element) pswp.element.classList.add('pswp--chrome-hidden')
          })

          // Video scrubber vs slide swipe. PhotoSwipe interprets any
          // horizontal drag over the slide area as a "swipe to next
          // slide". Dragging the native <video> scrubber (the bottom
          // control bar) is horizontal and gets hijacked. Fix: hook
          // PhotoSwipe's own pointerDown/Move/Up events and call
          // preventDefault() on the wrapped PhotoSwipeEvent — that
          // makes PhotoSwipe bail out of its gesture handler for THAT
          // pointer sequence only. Native controls in the video's
          // shadow DOM still receive their events normally because we
          // never touch DOM propagation.
          //
          // Trigger condition is narrow: the pointer must start inside
          // the scrubber zone (bottom ~60px of a <video> that currently
          // has native controls visible). Anywhere else on the video —
          // and anywhere else in the lightbox — PhotoSwipe's gestures
          // work exactly as before.
          const scrubberPointers = new Set()
          const isScrubberTouch = (orig) => {
            if (!orig) return false
            const t = orig.target
            const vid =
              (t && t.tagName === 'VIDEO' && t) ||
              t?.closest?.('.pswp-video-wrap video')
            if (!vid || !vid.hasAttribute('controls')) return false
            const rect = vid.getBoundingClientRect()
            const relY = orig.clientY - rect.top
            return relY >= rect.height - 60
          }
          pswp.on('pointerDown', (e) => {
            const orig = e.originalEvent
            if (!isScrubberTouch(orig)) return
            scrubberPointers.add(orig.pointerId)
            e.preventDefault()
          })
          pswp.on('pointerMove', (e) => {
            const orig = e.originalEvent
            if (orig && scrubberPointers.has(orig.pointerId)) {
              e.preventDefault()
            }
          })
          pswp.on('pointerUp', (e) => {
            const orig = e.originalEvent
            if (orig) scrubberPointers.delete(orig.pointerId)
          })

          // Autoplay on first click was failing across every theory
          // tried (HTML attribute alone, openingAnimationEnd hook,
          // canplay listener) so we stop guessing at PhotoSwipe's
          // lifecycle and just brute-force it: a MutationObserver
          // catches every <video> the instant it lands in the DOM, and
          // for the current slide's video we start a polling loop that
          // calls play() every 100ms for up to 3 seconds OR until the
          // video is actually playing. This survives any combination
          // of timing/visibility issues with PhotoSwipe's open
          // animation, Chrome's autoplay policy quirks, and slow data
          // loading.
          //
          // We never call v.load() — that aborts in-flight autoplay
          // and leaves the video frozen on its first frame (which is
          // exactly the bug the user was hitting).
          const primeVideo = (v) => {
            v.muted = true
            v.autoplay = true
            v.playsInline = true
          }
          const playPolls = new WeakMap()
          const pollPlay = (v) => {
            if (!v) return
            const prev = playPolls.get(v)
            if (prev) clearInterval(prev)
            primeVideo(v)
            // First synchronous attempt — usually wins on the second
            // slide and later.
            v.play().catch(() => {})
            let attempts = 0
            const interval = setInterval(() => {
              attempts++
              const isCurrent =
                pswp.currSlide?.holderElement?.contains(v) === true
              const isPlaying =
                !v.paused && !v.ended && v.readyState >= 2
              if (attempts > 30 || !isCurrent || isPlaying) {
                clearInterval(interval)
                playPolls.delete(v)
                return
              }
              v.play().catch(() => {})
            }, 100)
            playPolls.set(v, interval)
          }
          const syncVideos = () => {
            const root = pswp.element
            if (!root) return
            const currentVideo =
              pswp.currSlide?.holderElement?.querySelector('video') || null
            if (currentVideo) pollPlay(currentVideo)
            root.querySelectorAll('video').forEach((v) => {
              if (v !== currentVideo) {
                try { v.pause() } catch {}
                const prev = playPolls.get(v)
                if (prev) {
                  clearInterval(prev)
                  playPolls.delete(v)
                }
              }
            })
          }
          // Hit every PhotoSwipe event that could plausibly mean the
          // current slide is ready. Each one independently kicks the
          // poller; the first to succeed wins and the rest no-op.
          pswp.on('change', syncVideos)
          pswp.on('afterInit', syncVideos)
          pswp.on('contentActivate', syncVideos)
          pswp.on('slideActivate', syncVideos)
          pswp.on('openingAnimationEnd', syncVideos)
          pswp.on('initialZoomInEnd', syncVideos)

          // MutationObserver primes every video the instant it lands in
          // the lightbox DOM and starts polling it if it's the current
          // slide. This is earlier than any PhotoSwipe event and survives
          // PhotoSwipe internally cloning/moving the slide DOM during
          // the open animation.
          const mountObserver = new MutationObserver((records) => {
            for (const r of records) {
              for (const node of r.addedNodes) {
                if (node.nodeType !== 1) continue
                const vids =
                  node.tagName === 'VIDEO'
                    ? [node]
                    : Array.from(node.querySelectorAll?.('video') || [])
                for (const v of vids) {
                  primeVideo(v)
                  if (pswp.currSlide?.holderElement?.contains(v)) {
                    pollPlay(v)
                  }
                }
              }
            }
          })

          // Tap-to-toggle native controls + kick off a play poll the
          // moment PhotoSwipe says it's about to append this content.
          // contentAppend fires just BEFORE container.appendChild, so
          // we schedule the poll on the next microtask — by then the
          // video is in the DOM and pollPlay can actually find it via
          // pswp.currSlide.holderElement.contains(v).
          pswp.on('contentAppend', (e) => {
            const el = e.content?.element
            const wrap = el?.classList?.contains('pswp-video-wrap')
              ? el
              : el?.querySelector?.('.pswp-video-wrap')
            if (!wrap) return
            const video = wrap.querySelector('video')
            if (!video) return
            primeVideo(video)
            queueMicrotask(() => {
              if (pswp.currSlide?.holderElement?.contains(video)) {
                pollPlay(video)
              }
            })

            // Fallback when the mobile MP4 variant isn't ready yet
            // (server returns 404 with X-Mobile-Variant: generating).
            // For gifs, swap the <video> for an <img> — mobile Safari
            // can render the source .gif fine, just not inside <video>.
            // For real videos, retry with the source url; if the source
            // is a codec iOS can't play (e.g. .webm), there's nothing
            // more we can do until the encode finishes.
            //
            // Race note: the browser starts loading the video the moment
            // the html string is parsed, and contentAppend can fire
            // AFTER a fast 404 has already dispatched the error event.
            // `once: true` misses that early error, so we also check
            // video.error / networkState synchronously and dispatch the
            // fallback ourselves.
            const it = e.content?.data?._item
            if (it && wrap.dataset.errorBound !== '1') {
              wrap.dataset.errorBound = '1'
              let fallbackFired = false
              const applyFallback = () => {
                if (fallbackFired) return
                fallbackFired = true
                const usingMobile =
                  it.mobileUrl && video.src.includes(it.mobileUrl)
                if (!usingMobile || !it.url) return
                if (it.type === 'gif') {
                  const img = document.createElement('img')
                  img.src = it.url
                  img.alt = ''
                  img.style.maxWidth = '100%'
                  img.style.maxHeight = '100%'
                  img.style.objectFit = 'contain'
                  video.replaceWith(img)
                } else {
                  video.src = it.url
                  video.load()
                }
                // The user is now actually looking at the original file,
                // not the compressed mp4 — refresh the top-bar chip so
                // it says HD instead of the SD it was showing while the
                // <video> was still trying to load the mp4.
                window.__refreshHdChip?.()
              }
              video.addEventListener('error', applyFallback, { once: true })
              // NETWORK_NO_SOURCE = 3 — set when no valid src could be
              // loaded (matches the 404 case). Guard both this and
              // video.error in case the event already fired.
              if (video.error || video.networkState === 3) applyFallback()
            }
            if (wrap.dataset.tapBound) return
            wrap.dataset.tapBound = '1'
            wrap.addEventListener('click', (ev) => {
              if (ev.target !== wrap && ev.target !== video) return
              // Show-only. Clicks on the native controls (mute, play,
              // scrub) live in the video's shadow DOM and retarget to
              // <video>, so we can't tell a tap on the video frame
              // from a tap on the mute button. Toggling off here used
              // to hide the controls the instant the user tried to
              // unmute. Use the chrome-toggle button to dismiss.
              if (video.hasAttribute('controls')) return
              video.setAttribute('controls', '')
              // Push the bottom info panel and top date slider out
              // of the way so the native controls aren't covered.
              pswp.element?.classList.add('pswp--video-controls')
            })


            // Dedicated unmute button (bottom-right). Primary affordance
            // for audio — outside the native controls' shadow DOM so the
            // click doesn't race with anything. Honors a session-level
            // preference so once the user unmutes once, subsequent
            // videos start unmuted automatically (Reels/Twitter pattern).
            const btn = document.createElement('button')
            btn.className = 'pswp-video-unmute'
            btn.type = 'button'
            btn.setAttribute('aria-label', 'Unmute')
            btn.innerHTML =
              '<svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' +
              '<svg class="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'
            const syncBtn = () => {
              btn.classList.toggle('is-unmuted', !video.muted)
              btn.setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute')
            }
            if (videoUnmutedPref) {
              video.addEventListener('playing', () => {
                video.muted = false
                syncBtn()
              }, { once: true })
            }
            btn.addEventListener('click', (ev) => {
              ev.stopPropagation()
              video.muted = !video.muted
              videoUnmutedPref = !video.muted
              syncBtn()
            })
            syncBtn()
            wrap.appendChild(btn)
          })
          // Start the MutationObserver on afterInit — by then
          // pswp.element exists. PhotoSwipe defers appending the
          // actual content (including <video>) until *after* its
          // opening animation completes (heavy-append is gated by
          // `pswp.opener.isOpen`), so we observe BEFORE that append
          // happens and catch the video the instant it lands.
          pswp.on('afterInit', () => {
            if (pswp.element) {
              mountObserver.observe(pswp.element, {
                childList: true,
                subtree: true,
              })
            }
          })
          pswp.on('close', () => {
            try { mountObserver.disconnect() } catch {}
            const root = pswp.element
            if (!root) return
            root.querySelectorAll('video').forEach((v) => {
              v.pause()
              const prev = playPolls.get(v)
              if (prev) clearInterval(prev)
            })
          })

          pswp.init()
        })
      }

      // ─── CARD SIZE ────────────────────────────────────────────────────────
      const sizeBtns = document.querySelectorAll('.size-btn')
      const CARD_SIZES = { small: '160px', medium: '300px', large: '500px' }
      const MOBILE_COLS = { small: 4, medium: 2, large: 1 }
      const isMobile = () => window.matchMedia('(max-width: 640px)').matches

      // CSS gates the inline post-title overlay on body.card-size-large.
      function applyCardSizeClass(size) {
        document.body.classList.remove(
          'card-size-small',
          'card-size-medium',
          'card-size-large'
        )
        document.body.classList.add(`card-size-${size}`)
      }
      applyCardSizeClass(
        document.querySelector('.size-btn.active')?.dataset.size || 'small'
      )

      sizeBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          sizeBtns.forEach((b) => b.classList.toggle('active', b === btn))
          if (isMobile()) {
            document.documentElement.style.setProperty(
              '--mobile-cols',
              MOBILE_COLS[btn.dataset.size]
            )
          } else {
            document.documentElement.style.setProperty(
              '--card-min',
              CARD_SIZES[btn.dataset.size]
            )
          }
          applyCardSizeClass(btn.dataset.size)
        })
      })

      // ─── HOME GRID SIZE ───────────────────────────────────────────────────
      const HOME_CARD_SIZES = {
        small: '140px',
        medium: '200px',
        large: '280px',
      }
      const HOME_MOBILE_COLS = { small: 3, medium: 2, large: 1 }

      const homeShuffleBtn = document.getElementById('home-shuffle-btn')
      homeSortSelect.addEventListener('change', () => {
        homeSort = homeSortSelect.value
        if (homeSort === 'random') {
          // Re-picking Random always re-shuffles, so a second click gives a
          // fresh order even if you were already on Random.
          reshuffleHome()
          homeShuffleBtn.style.display = ''
        } else {
          homeShuffleBtn.style.display = 'none'
        }
        renderHomeGrid()
      })
      homeShuffleBtn.addEventListener('click', () => {
        reshuffleHome()
        renderHomeGrid()
      })

      // Stats expand/collapse — toggles the slide-down panel under the header.
      const statsToggleBtn = document.getElementById('stats-toggle')
      statsToggleBtn.addEventListener('click', () => {
        const panel = document.getElementById('stats-details')
        const open = panel.classList.toggle('open')
        statsToggleBtn.textContent = open ? '▴' : '▾'
        statsToggleBtn.title = open ? 'Hide details' : 'Show details'
      })

      homeSizeBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          homeSizeBtns.forEach((b) => b.classList.toggle('active', b === btn))
          if (isMobile()) {
            document.documentElement.style.setProperty(
              '--home-mobile-cols',
              HOME_MOBILE_COLS[btn.dataset.homeSize]
            )
          } else {
            document.documentElement.style.setProperty(
              '--home-card-min',
              HOME_CARD_SIZES[btn.dataset.homeSize]
            )
          }
        })
      })

      // ─── HOME BUTTON ──────────────────────────────────────────────────────
      document.getElementById('home-btn').addEventListener('click', () => {
        if (homeVisible) return
        showHomeView()
        userListEl
          .querySelectorAll('.user-item')
          .forEach((el) => el.classList.remove('active'))
      })

      // ─── MOBILE SIDEBAR ───────────────────────────────────────────────────
      const hamburger = document.getElementById('hamburger')
      const sidebarEl = document.getElementById('sidebar')
      const sidebarOverlay = document.getElementById('sidebar-overlay')

      function openSidebar() {
        sidebarEl.classList.add('open')
        sidebarOverlay.classList.add('visible')
        document.body.style.overflow = 'hidden'
      }

      function closeSidebar() {
        sidebarEl.classList.remove('open')
        sidebarOverlay.classList.remove('visible')
        document.body.style.overflow = ''
      }

      hamburger.addEventListener('click', () => {
        if (isMobile()) {
          sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar()
        } else {
          document.body.classList.toggle('sidebar-collapsed')
        }
      })
      sidebarOverlay.addEventListener('click', closeSidebar)

      // ─── HD TOGGLE ────────────────────────────────────────────────────────
      // Only meaningful on mobile — desktop already loads full-res URLs.
      // Sibling indicator lives in the PhotoSwipe top bar (see openLightbox).
      // Both share state via setHdMode() so tapping either updates both.
      const hdBtn = document.getElementById('hd-toggle')
      function syncHdBtn() {
        hdBtn.textContent = hdMode ? 'HD' : 'SD'
        hdBtn.classList.toggle('is-on', hdMode)
        hdBtn.setAttribute('aria-pressed', hdMode ? 'true' : 'false')
        hdBtn.title = hdMode
          ? 'HD mode ON — loading originals (uses more data). Tap for data-saver.'
          : 'Data-saver mode — loading compressed mp4s. Tap for full HD.'
      }
      if (IS_MOBILE) {
        hdBtn.style.display = 'flex'
        syncHdBtn()
        onHdChange(syncHdBtn)
        hdBtn.addEventListener('click', () => setHdMode(!hdMode))
      }

      // ─── RESCAN + SCAN STATUS ─────────────────────────────────────────────
      const rescanBtn = document.getElementById('rescan-btn')
      const scanBanner = document.getElementById('scan-banner')
      const scanBannerText = document.getElementById('scan-banner-text')
      let scanPollTimer = null

      function setBanner(text) {
        if (!text) {
          scanBanner.style.display = 'none'
          return
        }
        scanBannerText.textContent = text
        scanBanner.style.display = 'block'
      }

      async function pollScanStatus(initialDelay = 1000) {
        clearTimeout(scanPollTimer)
        const tick = async () => {
          try {
            const r = await fetch('/api/scan-status')
            const s = r.ok ? await r.json() : null
            if (!s) return
            if (s.inProgress) {
              rescanBtn.disabled = true
              rescanBtn.classList.add('spinning')
              const trig = s.trigger ? `${s.trigger} ` : ''
              setBanner(
                `Scanning… ${trig}${s.modelsDone}/${s.modelsTotal} models`
              )
              scanPollTimer = setTimeout(tick, 1500)
            } else {
              rescanBtn.disabled = false
              rescanBtn.classList.remove('spinning')
              setBanner('')
              // Scan just completed — refresh stats once
              if (s.completedAt) refreshUsers()
            }
          } catch {
            rescanBtn.disabled = false
            rescanBtn.classList.remove('spinning')
          }
        }
        scanPollTimer = setTimeout(tick, initialDelay)
      }

      rescanBtn.addEventListener('click', async () => {
        if (rescanBtn.disabled) return
        rescanBtn.disabled = true
        rescanBtn.classList.add('spinning')
        try {
          await fetch('/api/rescan', { method: 'POST' })
          pollScanStatus(500)
        } catch {
          rescanBtn.disabled = false
          rescanBtn.classList.remove('spinning')
        }
      })

      // Poll once on load — if the server is mid-startup-scan, surface a banner.
      pollScanStatus(0)

      // ─── INIT ─────────────────────────────────────────────────────────────
      loadUsers()

      // Version / last-updated footer — refreshed on the same interval as user stats
      const sidebarFooterEl = document.getElementById('sidebar-footer')
      const fmtShort = (iso) =>
        iso
          ? new Date(iso).toLocaleString('en-US', {
              month: 'short',
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit',
              hour12: true,
            })
          : '—'
      function refreshFooter() {
        fetch('/api/info')
          .then((r) => r.json())
          .then((info) => {
            sidebarFooterEl.innerHTML = `<span>Registry: ${fmtShort(info.registryUpdatedAt)}</span><span>Server up: ${fmtShort(info.startedAt)}</span>`
          })
          .catch(() => {})
      }
      refreshFooter()
      setInterval(refreshFooter, 5 * 60 * 1000)
    </script>
  </body>
</html>

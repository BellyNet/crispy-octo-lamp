<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrape Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #0d0d12;
        --panel: #191923;
        --panel-2: #20202c;
        --panel-3: #111119;
        --border: #2d2d3d;
        --border-soft: #242433;
        --accent: #7c6cfc;
        --accent-2: #42b7a8;
        --good: #46c083;
        --warn: #d9a441;
        --bad: #d95f67;
        --text: #e7e7f5;
        --muted: #9292b4;
        --muted-2: #686887;
      }

      html {
        scrollbar-color: #555579 #15151f;
        scrollbar-width: thin;
      }

      *::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }

      *::-webkit-scrollbar-track {
        background: #15151f;
      }

      *::-webkit-scrollbar-thumb {
        background: #555579;
        border: 3px solid #15151f;
        border-radius: 999px;
      }

      *::-webkit-scrollbar-thumb:hover {
        background: #6f6f9a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      button,
      input,
      select,
      a.button {
        font: inherit;
      }

      button,
      a.button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        padding: 8px 11px;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }

      button:hover,
      a.button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        font-weight: 700;
      }

      button.secondary {
        border-color: #2d5f59;
        background: #14312f;
        color: #cffff8;
      }

      button.danger {
        color: #ffd9dc;
        border-color: #6e2c34;
        background: #351920;
      }

      input,
      select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #0f0f16;
        color: var(--text);
        padding: 8px 10px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        min-height: 72px;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        border-bottom: 1px solid var(--border);
        background: #12121a;
      }

      .title-stack {
        min-width: 0;
      }

      .app-title {
        font-size: 20px;
        font-weight: 800;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      .content {
        min-width: 0;
        padding: 18px;
        display: grid;
        grid-template-columns: minmax(360px, 0.95fr) minmax(420px, 1.05fr);
        gap: 18px;
        align-items: start;
      }

      .stack {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        min-width: 0;
      }

      .panel-header {
        min-height: 52px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-title {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .panel-body {
        padding: 14px;
      }

      .workflow-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }

      .row > input {
        flex: 1;
      }

      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      label.check {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      label.check input,
      .source-row input[type='checkbox'] {
        width: auto;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .candidate-list,
      .saved-list,
      .job-list,
      .activity-log {
        display: grid;
        gap: 8px;
      }

      .candidate,
      .source-row,
      .job-row,
      .log-entry,
      .metric,
      .quick-card {
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        background: #15151e;
      }

      .quick-card {
        padding: 14px;
      }

      .quick-title {
        font-size: 18px;
        font-weight: 750;
      }

      .quick-meta {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .candidate,
      .source-row,
      .job-row {
        padding: 11px;
      }

      .candidate-top,
      .source-row,
      .job-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .candidate-title,
      .source-title,
      .job-title {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .url,
      .detail {
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .url {
        margin-top: 3px;
      }

      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .chip {
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #101018;
        color: var(--muted);
        padding: 2px 7px;
        font-size: 11px;
      }

      .chip.good {
        color: #c9ffe3;
        border-color: #245f44;
      }

      .chip.warn {
        color: #ffe9b6;
        border-color: #76551c;
      }

      .chip.bad {
        color: #ffd4d8;
        border-color: #7a3038;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .metric {
        padding: 10px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .metric-value {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .job-row {
        cursor: pointer;
      }

      .job-row.active {
        border-color: var(--accent);
        background: #1d1d2a;
      }

      .status {
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 750;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }

      .status.completed,
      .status.success {
        color: #c9ffe3;
        border: 1px solid #245f44;
        background: #11241d;
      }

      .status.failed,
      .status.canceled,
      .status.error {
        color: #ffd4d8;
        border: 1px solid #7a3038;
        background: #2b151a;
      }

      .status.running,
      .status.queued,
      .status.warn,
      .status.progress,
      .status.interrupted {
        color: #ffe9b6;
        border: 1px solid #76551c;
        background: #2b2210;
      }

      .activity-log {
        max-height: 560px;
        overflow: auto;
        padding-right: 2px;
      }

      .log-entry {
        padding: 10px 11px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 9px;
      }

      .log-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        margin-top: 6px;
        background: var(--muted-2);
      }

      .log-entry.progress .log-dot {
        background: var(--accent-2);
      }

      .log-entry.success .log-dot {
        background: var(--good);
      }

      .log-entry.warn .log-dot {
        background: var(--warn);
      }

      .log-entry.error .log-dot {
        background: var(--bad);
      }

      .log-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }

      .log-title {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .evidence-list {
        display: grid;
        gap: 4px;
        margin-top: 7px;
      }

      .evidence-item {
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .log-time {
        color: var(--muted-2);
        font-size: 11px;
        white-space: nowrap;
      }

      .empty {
        color: var(--muted);
        padding: 18px 0;
      }

      @media (max-width: 980px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .content,
        .options,
        .metric-grid {
          grid-template-columns: 1fr;
        }

        .workflow-grid,
        .candidate-top,
        .source-row,
        .job-row {
          grid-template-columns: 1fr;
        }

        .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-stack">
          <div class="app-title">Scrape Dashboard</div>
          <div id="registry-meta" class="muted">Loading registry...</div>
        </div>
        <div class="actions">
          <button id="refresh-models">Refresh</button>
          <button id="run-all" class="primary">Run Full Scrape</button>
        </div>
      </header>

      <main class="content">
        <div class="stack">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Run Everything</div>
            </div>
            <div class="panel-body">
              <div class="quick-card">
                <div class="workflow-grid">
                  <div>
                    <div class="quick-title">All registered sources</div>
                    <div id="source-total" class="quick-meta">
                      Counting saved sources...
                    </div>
                  </div>
                  <button id="run-all-panel" class="primary" type="button">
                    Run Full Scrape
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">Add Or Update Model</div>
                <div id="model-summary" class="muted">
                  No model is selected by default.
                </div>
              </div>
            </div>
            <div class="panel-body">
              <div class="workflow-grid">
                <label>
                  Model
                  <input
                    id="target-model"
                    list="model-options"
                    placeholder="Canonical model name"
                  />
                </label>
                <button id="load-target-model" type="button">
                  Load Sources
                </button>
              </div>
              <datalist id="model-options"></datalist>

              <div class="row" style="margin-top: 12px">
                <input
                  id="source-query"
                  placeholder="Username, profile URL, or source URL"
                />
                <button id="search-sources" class="primary" type="button">
                  Search Sources
                </button>
              </div>
              <div
                id="search-status"
                class="muted"
                style="margin-top: 9px"
              ></div>
              <div
                id="candidates"
                class="candidate-list"
                style="margin-top: 12px"
              ></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Saved Sources</div>
              <div class="actions">
                <button id="select-all-sources" type="button">
                  Select All
                </button>
                <button id="run-selected" class="secondary" type="button">
                  Run Checked
                </button>
              </div>
            </div>
            <div class="panel-body">
              <div id="saved-sources" class="saved-list"></div>
            </div>
          </section>
        </div>

        <div class="stack">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Run Options</div>
            </div>
            <div class="panel-body">
              <div class="options">
                <label class="check">
                  <input id="opt-skip-nas" type="checkbox" />
                  Skip NAS sync
                </label>
                <label class="check">
                  <input id="opt-dry-run" type="checkbox" />
                  Dry run
                </label>
                <label class="check">
                  <input id="opt-keep-history" type="checkbox" checked />
                  Keep history
                </label>
                <label class="check">
                  <input id="opt-stop-on-error" type="checkbox" />
                  Stop on error
                </label>
                <label>
                  Pages
                  <input id="opt-pages" placeholder="default" />
                </label>
                <label>
                  Max posts
                  <input id="opt-max-posts" placeholder="default" />
                </label>
                <label>
                  Max files
                  <input id="opt-max-files" placeholder="default" />
                </label>
                <label>
                  Post concurrency
                  <input id="opt-post-concurrency" placeholder="default" />
                </label>
                <label>
                  Image concurrency
                  <input id="opt-image-concurrency" placeholder="default" />
                </label>
                <label>
                  Video concurrency
                  <input id="opt-video-concurrency" placeholder="default" />
                </label>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Runs</div>
              <button id="cancel-job" class="danger" type="button">
                Cancel Active
              </button>
            </div>
            <div class="panel-body">
              <div id="jobs" class="job-list"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">Activity</div>
                <div id="selected-job-label" class="muted">
                  Waiting for a run.
                </div>
              </div>
            </div>
            <div class="panel-body">
              <div id="metrics" class="metric-grid"></div>
              <div id="activity-log" class="activity-log"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script>
      const state = {
        models: [],
        selectedJobId: null,
        jobs: [],
      }

      const registryMetaEl = document.getElementById('registry-meta')
      const sourceTotalEl = document.getElementById('source-total')
      const modelSummaryEl = document.getElementById('model-summary')
      const savedSourcesEl = document.getElementById('saved-sources')
      const candidatesEl = document.getElementById('candidates')
      const sourceQueryEl = document.getElementById('source-query')
      const targetModelEl = document.getElementById('target-model')
      const modelOptionsEl = document.getElementById('model-options')
      const searchStatusEl = document.getElementById('search-status')
      const jobsEl = document.getElementById('jobs')
      const selectedJobLabelEl = document.getElementById('selected-job-label')
      const metricsEl = document.getElementById('metrics')
      const activityLogEl = document.getElementById('activity-log')

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (char) => {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[char]
        })
      }

      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        })
        const payload = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`)
        return payload
      }

      function sourceLabel(key) {
        if (key === 'kemono') return 'Pawchive'
        if (key === 'coomer') return 'CoomerFans'
        if (key === 'reddit') return 'Reddit'
        if (key === 'stufferdb') return 'StufferDB'
        return key
      }

      function getTargetModelName() {
        return targetModelEl.value.trim()
      }

      function findTargetModel() {
        const value = getTargetModelName().toLowerCase()
        if (!value) return null
        return (
          state.models.find((model) => model.name.toLowerCase() === value) ||
          state.models.find((model) =>
            (model.aliases || []).some((alias) => alias.toLowerCase() === value)
          ) ||
          null
        )
      }

      function getSavedSources(model) {
        if (!model) return []
        const rows = []
        for (const [key, list] of Object.entries(model.sources || {})) {
          for (const source of list || []) {
            rows.push({
              key,
              label: sourceLabel(key),
              url: source.url,
              service: source.service || '',
              userId: source.userId || source.categoryId || '',
            })
          }
        }
        return rows
      }

      function renderRegistrySummary(payload = {}) {
        const modelCount = state.models.length
        const sourceCount = state.models.reduce(
          (total, model) => total + model.sourceCount,
          0
        )
        registryMetaEl.textContent = `${modelCount} models, ${sourceCount} saved sources`
        sourceTotalEl.textContent = `${sourceCount} saved sources across ${modelCount} models`
        if (payload.registryPath) registryMetaEl.title = payload.registryPath
      }

      function renderModelOptions() {
        modelOptionsEl.innerHTML = state.models
          .map((model) => `<option value="${escapeHtml(model.name)}"></option>`)
          .join('')
      }

      function renderSavedSources() {
        const targetModel = findTargetModel()
        const targetName = getTargetModelName()
        const rows = getSavedSources(targetModel)
        modelSummaryEl.textContent = targetModel
          ? `${targetModel.name}: ${targetModel.sourceCount} saved sources${targetModel.hasLocalMedia ? ' | local media found' : ''}`
          : targetName
            ? `${targetName}: ready for new sources`
            : 'No model is selected by default.'

        if (!targetName) {
          savedSourcesEl.innerHTML =
            '<div class="empty">Enter a model name to inspect or run its saved sources.</div>'
          return
        }

        if (!rows.length) {
          savedSourcesEl.innerHTML =
            '<div class="empty">No saved sources for this model yet.</div>'
          return
        }

        savedSourcesEl.innerHTML = rows
          .map(
            (source) => `
              <label class="source-row">
                <span>
                  <input class="source-check" type="checkbox" checked data-url="${escapeHtml(source.url)}" />
                  <span class="source-title">${escapeHtml(source.label)}</span>
                  <span class="chip">${escapeHtml(source.service || source.userId || 'source')}</span>
                  <div class="url">${escapeHtml(source.url)}</div>
                </span>
                <a class="button" href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">Open</a>
              </label>
            `
          )
          .join('')
      }

      function candidateMarkup(candidate) {
        if (candidate.type === 'manual-search') {
          return `
            <article class="candidate">
              <div class="candidate-top">
                <div>
                  <div class="candidate-title">StufferDB manual search</div>
                  <div class="url">${escapeHtml(candidate.url)}</div>
                  <div class="chips">
                    <span class="chip warn">manual</span>
                    <span class="chip">${escapeHtml(candidate.username)}</span>
                  </div>
                </div>
                <div class="actions">
                  <a class="button" href="${escapeHtml(candidate.url)}" target="_blank" rel="noreferrer">Open</a>
                </div>
              </div>
              <div class="row" style="margin-top: 10px">
                <input class="manual-stuffer-url" placeholder="Paste StufferDB category URL" />
                <button class="accept-manual-stuffer" type="button">Accept</button>
              </div>
            </article>
          `
        }

        const chips = [
          `<span class="chip">${escapeHtml(candidate.label)}</span>`,
          candidate.service
            ? `<span class="chip">${escapeHtml(candidate.service)}</span>`
            : '',
          candidate.existingModel
            ? `<span class="chip good">saved: ${escapeHtml(candidate.existingModel)}</span>`
            : '',
          candidate.verified === false
            ? '<span class="chip warn">verify</span>'
            : '<span class="chip good">matched</span>',
        ].join('')

        return `
          <article class="candidate" data-url="${escapeHtml(candidate.url)}">
            <div class="candidate-top">
              <div>
                <div class="candidate-title">${escapeHtml(candidate.name || candidate.username || candidate.label)}</div>
                <div class="url">${escapeHtml(candidate.url)}</div>
                <div class="chips">${chips}</div>
              </div>
              <div class="actions">
                <a class="button" href="${escapeHtml(candidate.url)}" target="_blank" rel="noreferrer">Open</a>
                <button class="accept-source" type="button" ${candidate.existingModel ? 'disabled' : ''}>Accept</button>
              </div>
            </div>
          </article>
        `
      }

      async function loadModels() {
        const payload = await api('/api/models')
        state.models = payload.models || []
        renderRegistrySummary(payload)
        renderModelOptions()
        renderSavedSources()
      }

      async function searchSources() {
        const query = sourceQueryEl.value.trim()
        if (!query) return
        searchStatusEl.textContent = 'Searching source sites...'
        candidatesEl.innerHTML = ''
        try {
          const payload = await api(
            `/api/source-search?q=${encodeURIComponent(query)}`
          )
          const candidates = payload.candidates || []
          searchStatusEl.textContent = `${candidates.length} candidate${candidates.length === 1 ? '' : 's'} found`
          candidatesEl.innerHTML = candidates.length
            ? candidates.map(candidateMarkup).join('')
            : '<div class="empty">No candidates found.</div>'
        } catch (err) {
          searchStatusEl.textContent = err.message
        }
      }

      async function acceptSource(url) {
        const targetModel = getTargetModelName()
        if (!targetModel) {
          throw new Error('Enter a model before accepting a source.')
        }
        const payload = await api(
          `/api/models/${encodeURIComponent(targetModel)}/sources`,
          {
            method: 'POST',
            body: JSON.stringify({ url }),
          }
        )
        targetModelEl.value = payload.model || targetModel
        await loadModels()
        searchStatusEl.textContent = `Saved source under ${targetModelEl.value}`
      }

      function getRunOptions() {
        const value = (id) => document.getElementById(id).value.trim()
        return {
          skipNasSync: document.getElementById('opt-skip-nas').checked,
          dryRun: document.getElementById('opt-dry-run').checked,
          keepHistory: document.getElementById('opt-keep-history').checked,
          stopOnError: document.getElementById('opt-stop-on-error').checked,
          pages: value('opt-pages'),
          maxPosts: value('opt-max-posts'),
          maxFiles: value('opt-max-files'),
          postConcurrency: value('opt-post-concurrency'),
          imageConcurrency: value('opt-image-concurrency'),
          videoConcurrency: value('opt-video-concurrency'),
        }
      }

      async function runSelectedSources() {
        const model = findTargetModel()
        const targetModel = model?.name || getTargetModelName()
        if (!targetModel) return
        const sources = [
          ...document.querySelectorAll('.source-check:checked'),
        ].map((input) => input.dataset.url)
        if (!sources.length) return
        const payload = await api('/api/jobs', {
          method: 'POST',
          body: JSON.stringify({
            model: targetModel,
            sources,
            options: getRunOptions(),
          }),
        })
        state.selectedJobId = payload.job.id
        await refreshJobs()
      }

      async function runAllSources() {
        const payload = await api('/api/jobs', {
          method: 'POST',
          body: JSON.stringify({
            mode: 'all',
            options: getRunOptions(),
          }),
        })
        state.selectedJobId = payload.job.id
        await refreshJobs()
      }

      function formatDuration(start, finish) {
        if (!start) return '-'
        const end = finish ? new Date(finish).getTime() : Date.now()
        const seconds = Math.max(0, Math.round((end - new Date(start)) / 1000))
        if (seconds < 60) return `${seconds}s`
        const minutes = Math.floor(seconds / 60)
        return `${minutes}m ${seconds % 60}s`
      }

      function renderMetrics(job) {
        if (!job) {
          metricsEl.innerHTML = ''
          return
        }
        const totals = job.summary?.totals || {}
        const items = [
          ['Status', job.status],
          ['Sources', String(totals.sources || 0)],
          ['Saved', String(totals.saved || 0)],
          ['Duration', formatDuration(job.startedAt, job.finishedAt)],
        ]
        metricsEl.innerHTML = items
          .map(
            ([label, value]) => `
              <div class="metric">
                <div class="metric-label">${escapeHtml(label)}</div>
                <div class="metric-value">${escapeHtml(value)}</div>
              </div>
            `
          )
          .join('')
      }

      function counterText(item = {}) {
        return [
          `source ${item.sourceIndex || 0}/${item.sourceTotal || 0}`,
          `saved ${item.saved || 0}`,
          `skipped ${item.skipped || 0}`,
          `duplicates ${item.duplicates || 0}`,
          `errors ${item.errors || 0}`,
        ].join(' | ')
      }

      function totalText(totals = {}) {
        const sources = totals.totalSources || totals.sources || 0
        const models = totals.totalModels
          ? `models ${totals.modelsAttempted || 0}/${totals.totalModels} | `
          : ''
        return `${models}sources ${totals.sources || 0}/${sources} | saved ${totals.saved || 0} | skipped ${totals.skipped || 0} | duplicates ${totals.duplicates || 0} | errors ${totals.errors || 0}`
      }

      function sourceSummaryMarkup(source, titlePrefix = '') {
        const level = source.errors || !source.ok ? 'error' : 'success'
        const title = `${titlePrefix}${source.label || 'Source'}`
        const failure = source.failure
          ? ` | ${source.failure.code || 'failure'}`
          : ''
        const duplicateEvidence = (source.evidence?.duplicates || [])
          .slice(0, 3)
          .map((item) => {
            const matched = item.savedPath ? ` -> ${item.savedPath}` : ''
            const post = item.postId ? ` (${item.postId})` : ''
            return `${item.type || 'duplicate'}: ${item.filename || item.title || item.url || 'media'}${post}${matched}`
          })
        const errorEvidence = (source.evidence?.errors || [])
          .slice(0, 3)
          .map((item) => {
            const post = item.postId ? ` (${item.postId})` : ''
            return `${item.type || 'error'}${post}: ${item.message || item.filename || item.url || 'see raw log'}`
          })
        const evidence = [...errorEvidence, ...duplicateEvidence]
          .map(
            (text) => `<span class="evidence-item">${escapeHtml(text)}</span>`
          )
          .join('')
        return `
          <article class="log-entry ${level}">
            <span class="log-dot"></span>
            <span>
              <span class="log-head">
                <span class="log-title">${escapeHtml(title)}</span>
                <span class="status ${level}">${escapeHtml(source.status || (source.ok ? 'ok' : 'failed'))}</span>
              </span>
              <span class="detail">${escapeHtml(counterText(source) + failure)}</span>
              ${
                evidence ? `<span class="evidence-list">${evidence}</span>` : ''
              }
            </span>
          </article>
        `
      }

      function finalTotalMarkup(summary) {
        const level =
          summary.totals?.sourceFailures || summary.totals?.errors
            ? 'warn'
            : 'success'
        return `
          <article class="log-entry ${level}">
            <span class="log-dot"></span>
            <span>
              <span class="log-head">
                <span class="log-title">Run summary</span>
                <span class="status ${level}">analyzed</span>
              </span>
              <span class="detail">${escapeHtml(summary.analysis || '')}</span>
              <span class="detail">${escapeHtml(totalText(summary.totals || {}))}</span>
            </span>
          </article>
        `
      }

      function currentRunMarkup(summary) {
        const current = summary.current
        if (!current) return ''
        const sourceText = current.sourceTotal
          ? `source ${current.sourceIndex || 0}/${current.sourceTotal}${current.sourceLabel ? ` | ${current.sourceLabel}` : ''}`
          : 'starting sources'
        const urlText = current.url
          ? `<span class="detail">${escapeHtml(current.url)}</span>`
          : ''
        const modelText = current.modelTotal
          ? `user ${current.model} (${current.modelIndex}/${current.modelTotal})`
          : `user ${current.model}`
        return `
          <article class="log-entry progress">
            <span class="log-dot"></span>
            <span>
              <span class="log-head">
                <span class="log-title">On ${escapeHtml(modelText)}</span>
                <span class="status progress">running</span>
              </span>
              <span class="detail">${escapeHtml(sourceText)}</span>
              ${urlText}
            </span>
          </article>
        `
      }

      function renderActivity(job) {
        if (!job) {
          selectedJobLabelEl.textContent = 'Waiting for a run.'
          activityLogEl.innerHTML =
            '<div class="empty">Start a full scrape or model source run to see activity here.</div>'
          renderMetrics(null)
          return
        }
        selectedJobLabelEl.textContent = `#${job.id} ${job.model}`
        renderMetrics(job)
        const summary = job.summary || {}
        const entries = [currentRunMarkup(summary)]

        if (summary.kind === 'all') {
          const recentModels = summary.recentModels?.length
            ? summary.recentModels
            : summary.latestModel
              ? [summary.latestModel]
              : []
          for (const model of recentModels) {
            entries.push(
              finalTotalMarkup({
                analysis: `User ${model.model}.`,
                totals: model.totals,
              })
            )
            entries.push(
              ...model.sources.map((source) =>
                sourceSummaryMarkup(source, `${model.model}: `)
              )
            )
          }
          if (summary.failedModels?.length) {
            entries.push(
              ...summary.failedModels.map((model) =>
                finalTotalMarkup({
                  analysis: `Needs review: ${model.model}.`,
                  totals: model.totals,
                })
              )
            )
          }
        } else {
          entries.push(
            ...(summary.sources || []).map((source) =>
              sourceSummaryMarkup(source)
            )
          )
        }

        if (
          job.finishedAt ||
          job.status === 'completed' ||
          job.status === 'failed' ||
          job.status === 'canceled' ||
          job.status === 'interrupted'
        ) {
          entries.push(finalTotalMarkup(summary))
        }

        activityLogEl.innerHTML = entries.filter(Boolean).length
          ? entries.filter(Boolean).join('')
          : '<div class="empty">Run has started. Waiting for the first source summary.</div>'
      }

      function renderJobs(jobs) {
        state.jobs = jobs
        if (!jobs.length) {
          jobsEl.innerHTML = '<div class="empty">No runs yet.</div>'
          renderActivity(null)
          return
        }
        if (!state.selectedJobId) state.selectedJobId = jobs[0].id
        const selected =
          jobs.find((job) => job.id === state.selectedJobId) || jobs[0]
        state.selectedJobId = selected.id
        jobsEl.innerHTML = jobs
          .slice(0, 8)
          .map(
            (job) => `
              <div class="job-row ${job.id === selected.id ? 'active' : ''}" data-job-id="${job.id}">
                <div>
                  <div class="job-title">#${job.id} ${escapeHtml(job.model)}</div>
                  <div class="muted">${
                    job.mode === 'all'
                      ? 'all registered sources'
                      : `${job.sources.length} source${job.sources.length === 1 ? '' : 's'}`
                  } | ${escapeHtml(formatDuration(job.startedAt, job.finishedAt))}</div>
                </div>
                <span class="status ${escapeHtml(job.status)}">${escapeHtml(job.status)}</span>
              </div>
            `
          )
          .join('')
        renderActivity(selected)
      }

      async function refreshJobs() {
        try {
          const payload = await api('/api/jobs')
          renderJobs(payload.jobs || [])
        } catch (err) {
          activityLogEl.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`
        }
      }

      candidatesEl.addEventListener('click', async (event) => {
        const accept = event.target.closest('.accept-source')
        const manual = event.target.closest('.accept-manual-stuffer')
        try {
          if (accept) {
            const card = accept.closest('.candidate')
            await acceptSource(card.dataset.url)
            accept.textContent = 'Accepted'
            accept.disabled = true
          } else if (manual) {
            const card = manual.closest('.candidate')
            const input = card.querySelector('.manual-stuffer-url')
            await acceptSource(input.value.trim())
            manual.textContent = 'Accepted'
            manual.disabled = true
          }
        } catch (err) {
          searchStatusEl.textContent = err.message
        }
      })

      jobsEl.addEventListener('click', (event) => {
        const row = event.target.closest('.job-row')
        if (!row) return
        state.selectedJobId = Number(row.dataset.jobId)
        renderJobs(state.jobs)
      })

      document
        .getElementById('search-sources')
        .addEventListener('click', searchSources)
      sourceQueryEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') searchSources()
      })
      targetModelEl.addEventListener('input', renderSavedSources)
      targetModelEl.addEventListener('change', renderSavedSources)
      document
        .getElementById('load-target-model')
        .addEventListener('click', renderSavedSources)
      document
        .getElementById('refresh-models')
        .addEventListener('click', loadModels)
      document
        .getElementById('run-selected')
        .addEventListener('click', runSelectedSources)
      document
        .getElementById('run-all')
        .addEventListener('click', runAllSources)
      document
        .getElementById('run-all-panel')
        .addEventListener('click', runAllSources)
      document
        .getElementById('select-all-sources')
        .addEventListener('click', () => {
          const checks = [...document.querySelectorAll('.source-check')]
          const allChecked =
            checks.length && checks.every((input) => input.checked)
          checks.forEach((input) => {
            input.checked = !allChecked
          })
        })
      document
        .getElementById('cancel-job')
        .addEventListener('click', async () => {
          if (!state.selectedJobId) return
          await api(`/api/jobs/${state.selectedJobId}/cancel`, {
            method: 'POST',
          })
          await refreshJobs()
        })

      loadModels().catch((err) => {
        registryMetaEl.textContent = err.message
      })
      refreshJobs()
      setInterval(refreshJobs, 800)
      setInterval(() => loadModels().catch(() => {}), 30000)
    </script>
  </body>
</html>

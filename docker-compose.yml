services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - '3420:3420'
    volumes:
      # Writable so the in-container nightly maintenance pass can transcode
      # .webm → .mp4 and remux non-faststart files in place. The dashboard
      # itself never writes to this mount outside of those scheduled passes
      # — read-only behavior is preserved by the application code, not by
      # the bind mount.
      - /share/Vault69/dataset:/data/dataset
      # Live registry — updated by sync; picked up on next /api/users request, no rebuild needed
      - /share/Vault69/model_aliases.json:/app/model_aliases.json:ro
      # Derived assets (grid thumbs, gif previews, mobile-friendly mp4 variants,
      # response/meta caches, featured & registry state) — bind-mounted onto the
      # NAS so they survive container/volume prunes and don't have to be
      # regenerated. Everything the server writes goes through THUMB_DIR;
      # keeping it on the vault share means 7 TB of permanent room and a
      # single backup target alongside the raw dataset.
      - /share/Vault69/dashboard-cache:/data/thumbs
    environment:
      DATASET_DIR: /data/dataset
      THUMB_DIR: /data/thumbs
      DASHBOARD_PORT: 3420
      DASHBOARD_PASSWORD: gitgut
      # Bump the mobile-variant encoder from the default 2 parallel to
      # 6. On a QNAP with the dataset on its own disk, 2 workers were
      # taking 27-48 hours per full nightly pass — nowhere near
      # keeping up with the scraper adding new videos each day. 6
      # workers finishes a ~4k backlog in ~6-8 hours and can catch
      # up between scrapes. If ffmpeg starts starving other services
      # (Container Station "high CPU" warnings), drop back to 4.
      MOBILE_ENCODE_CONCURRENCY: 6
      # Also bump the grid-thumb prewarm queue so a fresh model shows
      # up faster after a scrape.
      PREWARM_CONCURRENCY: 4

services:
  dashboard:
    build: .
    restart: unless-stopped
    # Run as the NAS share user (tjegan:everyone) rather than root, so files
    # the dashboard creates (transcodes, remuxes, cache) stay readable and
    # writable from the PC over SMB. deploy-dashboard.ps1 hands any existing
    # root-owned files back to this user before starting the container.
    user: '1000:100'
    ports:
      - '3420:3420'
    volumes:
      # Writable so the in-container nightly maintenance pass can transcode
      # .webm → .mp4 and remux non-faststart files in place. The dashboard
      # itself never writes to this mount outside of those scheduled passes
      # — read-only behavior is preserved by the application code, not by
      # the bind mount.
      - /share/Vault69/dataset:/data/dataset
      # Derived assets (grid thumbs, gif previews, mobile-friendly mp4 variants,
      # response/meta caches, featured & registry state) — bind-mounted onto the
      # NAS so they survive container/volume prunes and don't have to be
      # regenerated. Everything the server writes goes through THUMB_DIR;
      # keeping it on the vault share means 7 TB of permanent room and a
      # single backup target alongside the raw dataset.
      - /share/Vault69/dashboard-cache:/data/thumbs
      # Scraper state for scrapes run on the NAS: the scrape queue, scratch
      # downloads, run reports, and the model registry (see
      # MODEL_REGISTRY_PATH below).
      - /share/Vault69/slopvault-state:/data/state
    environment:
      DATASET_DIR: /data/dataset
      THUMB_DIR: /data/thumbs
      # The model registry everything syncs with: the Sources page edits it,
      # NAS scrapes update it, and the PC sends its changes through the
      # dashboard (scrapyard/registrySync.js). It sits in a mounted folder,
      # not a single-file mount, so saves can write a temp file and rename it.
      MODEL_REGISTRY_PATH: /data/state/model_aliases.json
      DASHBOARD_PORT: 3420
      # Kept out of the repo: set DASHBOARD_PASSWORD in the .env file next to
      # this compose file on the NAS (deploy-dashboard.ps1 prompts for it).
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env next to docker-compose.yml}
      # Bump the mobile-variant encoder from the default 2 parallel to
      # 6. On a QNAP with the dataset on its own disk, 2 workers were
      # taking 27-48 hours per full nightly pass — nowhere near
      # keeping up with the scraper adding new videos each day. 6
      # workers finishes a ~4k backlog in ~6-8 hours and can catch
      # up between scrapes. If ffmpeg starts starving other services
      # (Container Station "high CPU" warnings), drop back to 4.
      #
      # Tried 12 on 2026-09-09 to burn down backlog faster — measured
      # WORSE throughput (~160-200 files/hr vs ~500-670/hr at 6) and
      # load average nearly doubled (~23 -> ~40). The N5095 is only 4
      # cores; going past 6 oversubscribes it enough to thrash instead
      # of helping (scheduling overhead / possible thermal throttling
      # under sustained full load). Don't raise this again without
      # re-testing — 6 is the known-good ceiling for this hardware.
      MOBILE_ENCODE_CONCURRENCY: 6
      # Also bump the grid-thumb prewarm queue so a fresh model shows
      # up faster after a scrape.
      PREWARM_CONCURRENCY: 4
